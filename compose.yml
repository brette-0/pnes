# Cross-platform build entry point for platform-nes.
#
# Run from the repository root, in any shell (PowerShell, bash, zsh, cmd):
#
#   docker compose run --rm build-linux     # Linux desktop demo
#   docker compose run --rm build-nes       # NES ROM (demo.nes)
#   docker compose run --rm build-gc        # GameCube demo.dol
#   docker compose run --rm build-wii       # Wii demo.dol (also runs on Wii U / vWii)
#   docker compose run --rm build-3ds       # Nintendo 3DS demo.3dsx
#
# Override the preset by setting PRESET in the environment:
#
#   PRESET=linux-debug docker compose run --rm build-linux          # bash
#   $env:PRESET="linux-debug"; docker compose run --rm build-linux  # PowerShell
#
# The same image also carries the i386 and arm64 multiarch SDL3/libusb/ALSA
# packages (plus g++-multilib / crossbuild-essential-arm64) needed for the
# 32-bit and arm64 builds, selected the same way:
#
#   PRESET=linux-x86-release   docker compose run --rm build-linux
#   PRESET=linux-arm64-release docker compose run --rm build-linux
#
# linux-arm64-release is a real cross build here (this image is amd64) --
# CMakeLists.txt only allows targeting arm64 from a non-arm64 host when
# /.dockerenv is present, which is always true inside this container.
#
# Output is written to ./cmake-build-ci-<preset-name> in the repository root
# (kept out of builds/, which is reserved for non-CI local/IDE build trees).
# These are the same commands CI runs (.github/workflows/ci.yml), so the
# Linux and NES jobs reproduce locally byte-for-byte (also via `act -j ...`).
#
# File ownership of the build output:
#   The containers run as ${UID}:${GID}, defaulting to 0:0 (root) when those
#   are unset -- which is what CI uses, so CI output stays root-owned exactly as
#   before. To make LOCAL output owned by you (so you can delete build trees
#   without sudo), pass your ids on the command line:
#
#       UID=$(id -u) GID=$(id -g) docker compose run --rm build-gc
#
#   or, to avoid repeating it, create an uncommitted .env in the repo root once:
#
#       printf 'UID=%s\nGID=%s\n' "$(id -u)" "$(id -g)" > .env
#
#   Compose auto-loads .env; it is gitignored so it never reaches CI's checkout
#   (CI then falls back to the 0:0 default). $HOME is pointed at /tmp because a
#   non-root uid has no home directory inside the image.

services:
  build-nes:
    build:
      context: docker
      dockerfile: Dockerfile.nes
    image: platform-nes-nes:trixie
    user: "${UID:-0}:${GID:-0}"
    working_dir: /tmp/platform-nes
    volumes:
      - .:/tmp/platform-nes
    environment:
      PRESET: ${PRESET:-nes-release}
      HOME: /tmp
    command:
      - bash
      - -c
      - |
        set -euo pipefail
        # Pass the toolchain + prefix + top-level linker script explicitly
        # rather than letting CMakeLists derive them from local.cmake: that
        # file is gitignored (per-developer), so it never reaches CI's
        # checkout, and even a bind-mounted local dev copy would FORCE these
        # to host paths that don't exist inside the container. Build into a
        # dedicated dir so the container never clashes with an
        # IDE-configured cmake-build-nes-* tree (their CMakeCache.txt
        # records a different, host source path).
        # PLATFORM_NES_AUDIO_SECTION and PLATFORM_NES_UI_SECTION are here for
        # the same reason as TOPLEVEL_LD: all three are mandatory with no
        # default (a guessed section would place the module in whatever bank
        # the library assumed, which is the wrong-bank-with-no-diagnostic
        # failure the design exists to prevent), and all three normally come
        # from the gitignored local.cmake. Audio's value must match
        # demo/famistudio_config.s's code segment -- CMakeLists encodes this
        # value into the .inc that file includes, so this is the one place
        # the two are named. UI has no such external contract -- .prg_rom_cold
        # co-locates it with the cold bank, same as local.cmake.example.
        cmake --preset "$$PRESET" -B "cmake-build-ci-$$PRESET" \
          -DCMAKE_TOOLCHAIN_FILE="$$LLVM_MOS_SDK/lib/cmake/llvm-mos-sdk/llvm-mos-toolchain.cmake" \
          -DCMAKE_PREFIX_PATH="$$LLVM_MOS_SDK" \
          -DTOPLEVEL_LD=/tmp/platform-nes/demo/link.ld \
          -DPLATFORM_NES_AUDIO_SECTION=.prg_rom_audio \
          -DPLATFORM_NES_UI_SECTION=.prg_rom_cold
        cmake --build "cmake-build-ci-$$PRESET" -j"$$(nproc)"
        echo "Built: cmake-build-ci-$$PRESET/demo.nes"

  build-linux:
    build:
      context: docker
      dockerfile: Dockerfile.linux
    image: platform-nes-linux:bullseye
    user: "${UID:-0}:${GID:-0}"
    working_dir: /tmp/platform-nes
    volumes:
      - .:/tmp/platform-nes
    environment:
      PRESET: ${PRESET:-linux-release}
      HOME: /tmp
    command:
      - bash
      - -c
      - |
        set -euo pipefail
        # Dedicated build dir (see build-nes) so the container never clashes
        # with an IDE-configured cmake-build-linux-* tree on the host mount.
        cmake --preset "$$PRESET" -B "cmake-build-ci-$$PRESET"
        cmake --build "cmake-build-ci-$$PRESET" -j"$$(nproc)"
        echo "Built: cmake-build-ci-$$PRESET/demo"

  # GameCube + Wii share one image (devkitPPC + libogc); the preset selects the
  # console toolchain (GameCube.cmake vs Wii.cmake). The gc-/wii-release presets
  # already point CMAKE_TOOLCHAIN_FILE at $DEVKITPRO/cmake/*, and DEVKITPRO is
  # exported by the base image, so no explicit -DCMAKE_TOOLCHAIN_FILE is needed
  # (unlike build-nes, whose SDK path can't be derived from a bind-mounted
  # local.cmake). The OGC branch never reads LLVM_MOS_SDK, so a forced value in a
  # developer's local.cmake is inert here.
  build-gc:
    build:
      context: docker
      dockerfile: Dockerfile.ogc
    image: platform-nes-ogc:latest
    user: "${UID:-0}:${GID:-0}"
    working_dir: /tmp/platform-nes
    volumes:
      - .:/tmp/platform-nes
    environment:
      PRESET: ${PRESET:-gc-release}
      HOME: /tmp
    command:
      - bash
      - -c
      - |
        set -euo pipefail
        cmake --preset "$$PRESET" -B "cmake-build-ci-$$PRESET"
        cmake --build "cmake-build-ci-$$PRESET" -j"$$(nproc)"
        echo "Built: cmake-build-ci-$$PRESET/demo.dol"

  build-wii:
    build:
      context: docker
      dockerfile: Dockerfile.ogc
    image: platform-nes-ogc:latest
    user: "${UID:-0}:${GID:-0}"
    working_dir: /tmp/platform-nes
    volumes:
      - .:/tmp/platform-nes
    environment:
      PRESET: ${PRESET:-wii-release}
      HOME: /tmp
    command:
      - bash
      - -c
      - |
        set -euo pipefail
        cmake --preset "$$PRESET" -B "cmake-build-ci-$$PRESET"
        cmake --build "cmake-build-ci-$$PRESET" -j"$$(nproc)"
        echo "Built: cmake-build-ci-$$PRESET/demo.dol"

  # Nintendo 3DS (devkitARM + libctru + citro2d). The ctr-release preset points
  # CMAKE_TOOLCHAIN_FILE at $DEVKITPRO/cmake/3DS.cmake, and DEVKITPRO is exported
  # by the base image, so no explicit -DCMAKE_TOOLCHAIN_FILE is needed (unlike
  # build-nes). The backend renders the shared software PPU to one RGBA texture
  # via citro2d (the PICA200 has no paletted textures), so it never reads
  # LLVM_MOS_SDK and a forced value in a developer's local.cmake is inert here.
  build-3ds:
    build:
      context: docker
      dockerfile: Dockerfile.3ds
    image: platform-nes-3ds:latest
    user: "${UID:-0}:${GID:-0}"
    working_dir: /tmp/platform-nes
    volumes:
      - .:/tmp/platform-nes
    environment:
      PRESET: ${PRESET:-ctr-release}
      HOME: /tmp
    command:
      - bash
      - -c
      - |
        set -euo pipefail
        cmake --preset "$$PRESET" -B "cmake-build-ci-$$PRESET"
        cmake --build "cmake-build-ci-$$PRESET" -j"$$(nproc)"
        echo "Built: cmake-build-ci-$$PRESET/demo.3dsx"

  # Nintendo Switch (devkitA64 + libnx). The switch-release preset points
  # CMAKE_TOOLCHAIN_FILE at $DEVKITPRO/cmake/Switch.cmake, and DEVKITPRO is
  # exported by the base image, so no explicit -DCMAKE_TOOLCHAIN_FILE is needed
  # (unlike build-nes). The backend rasterises the shared software PPU and CPU
  # scale-blits it into the libnx framebuffer (no deko3d), so it never reads
  # LLVM_MOS_SDK and a forced value in a developer's local.cmake is inert here.
  build-switch:
    build:
      context: docker
      dockerfile: Dockerfile.switch
    image: platform-nes-switch:latest
    user: "${UID:-0}:${GID:-0}"
    working_dir: /tmp/platform-nes
    volumes:
      - .:/tmp/platform-nes
    environment:
      PRESET: ${PRESET:-switch-release}
      HOME: /tmp
    command:
      - bash
      - -c
      - |
        set -euo pipefail
        cmake --preset "$$PRESET" -B "cmake-build-ci-$$PRESET"
        cmake --build "cmake-build-ci-$$PRESET" -j"$$(nproc)"
        echo "Built: cmake-build-ci-$$PRESET/demo.nro"

  # Native Nintendo Wii U (devkitPPC + wut + the SDL2 portlib). The wiiu-release
  # preset points CMAKE_TOOLCHAIN_FILE at $DEVKITPRO/cmake/WiiU.cmake, and
  # DEVKITPRO is exported by the base image, so no explicit -DCMAKE_TOOLCHAIN_FILE
  # is needed (unlike build-nes). This is the NATIVE Cafe OS target (.rpx/.wuhb),
  # NOT the vWii .dol from build-wii. The backend rasterises the shared software
  # PPU into an SDL2 streaming texture the GPU scales to the window, so it never
  # reads LLVM_MOS_SDK and a forced value in a developer's local.cmake is inert.
  build-wiiu:
    build:
      context: docker
      dockerfile: Dockerfile.wiiu
    image: platform-nes-wiiu:latest
    user: "${UID:-0}:${GID:-0}"
    working_dir: /tmp/platform-nes
    volumes:
      - .:/tmp/platform-nes
    environment:
      PRESET: ${PRESET:-wiiu-release}
      HOME: /tmp
      # Optional: the Wii U common key (32 hex, or a path to a file holding it).
      # When set, demo-wup encrypts an installable WUP; when empty it just emits
      # the unpacked tree. NEVER committed -- supply it on the host invocation,
      # e.g.  WIIU_COMMON_KEY=<key> docker compose run --rm build-wiiu
      WIIU_COMMON_KEY: ${WIIU_COMMON_KEY:-}
    command:
      - bash
      - -c
      - |
        set -euo pipefail
        cmake --preset "$$PRESET" -B "cmake-build-ci-$$PRESET"
        cmake --build "cmake-build-ci-$$PRESET" -j"$$(nproc)"
        # Also assemble the installable-title path: demo-wup emits the unpacked
        # code/content/meta tree and, when WIIU_COMMON_KEY is set, packs a WUP.
        # Without a key it skips encryption (leaving the usable tree), so this is
        # safe to run unconditionally -- no secret is needed for the homebrew build.
        cmake --build "cmake-build-ci-$$PRESET" --target demo-wup
        echo "Built: cmake-build-ci-$$PRESET/demo.rpx (+ .wuhb, + wup/ tree)"

  # Nintendo DS (devkitARM + libnds). The nds-release preset points
  # CMAKE_TOOLCHAIN_FILE at $DEVKITPRO/cmake/NDS.cmake, and DEVKITPRO is exported
  # by the base image, so no explicit -DCMAKE_TOOLCHAIN_FILE is needed (unlike
  # build-nes). This is Model B: the backend maps the NES PPU onto the DS's native
  # 2D tile hardware (BG tilemap + hardware OBJ + per-scanline HBlank scroll) via
  # the shared emu band/OAM seam, so it never reads LLVM_MOS_SDK and a forced
  # value in a developer's local.cmake is inert here.
  build-nds:
    build:
      context: docker
      dockerfile: Dockerfile.nds
    image: platform-nes-nds:latest
    user: "${UID:-0}:${GID:-0}"
    working_dir: /tmp/platform-nes
    volumes:
      - .:/tmp/platform-nes
    environment:
      PRESET: ${PRESET:-nds-release}
      HOME: /tmp
    command:
      - bash
      - -c
      - |
        set -euo pipefail
        cmake --preset "$$PRESET" -B "cmake-build-ci-$$PRESET"
        cmake --build "cmake-build-ci-$$PRESET" -j"$$(nproc)"
        echo "Built: cmake-build-ci-$$PRESET/demo.nds"

  # Nintendo DSi -- the same libnds backend and image as build-nds, but the
  # dsi-release preset compiles with TARGET_DSI (the 16 MB / faster-clock variant
  # that may later embed crunched audio; for now it shares the DS audio stub). A
  # standard .nds runs on DSi, so the ROM packaging is identical.
  build-dsi:
    build:
      context: docker
      dockerfile: Dockerfile.nds
    image: platform-nes-nds:latest
    user: "${UID:-0}:${GID:-0}"
    working_dir: /tmp/platform-nes
    volumes:
      - .:/tmp/platform-nes
    environment:
      PRESET: ${PRESET:-dsi-release}
      HOME: /tmp
    command:
      - bash
      - -c
      - |
        set -euo pipefail
        cmake --preset "$$PRESET" -B "cmake-build-ci-$$PRESET"
        cmake --build "cmake-build-ci-$$PRESET" -j"$$(nproc)"
        echo "Built: cmake-build-ci-$$PRESET/demo.nds"
