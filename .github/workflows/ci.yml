          path: demo/gen

      - name: Cache build tree
        uses: actions/cache@v5
        with:
          path: cmake-build-ci-ctr-release
          key: ctr-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', 'docker/Dockerfile.3ds') }}
          restore-keys: ctr-

      - name: Build demo.3dsx
        run: docker compose run --rm --build build-3ds

      - uses: actions/upload-artifact@v7
        with:
