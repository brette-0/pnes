  win-x64:
    name: Windows (x64) (exe)
    needs: codegen-check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      # demo/gen/ (uitk's output) is gitignored -- codegen-check is the only
      # job that builds/runs uitk itself (it needs Qt); every other job just
      # downloads what it produced instead of installing Qt itself.
      - name: Download generated UI code
        uses: actions/download-artifact@v7
        with:
          name: demo-gen
          path: demo/gen

      # Set up the MSVC developer environment: provides the Windows SDK headers/
      # libs and puts Visual Studio's bundled Ninja on PATH. clang (preinstalled
      # on the runner) then targets the MSVC ABI while still accepting the GNU
      # compound-literal / gnu++23 extensions the engine relies on -- which cl
      # would reject.
      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Cache build tree
        uses: actions/cache@v5
        with:
          path: cmake-build-win-x64-release
          key: win-x64-v2-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json') }}
          restore-keys: win-x64-v2-

      - name: Build demo
        shell: cmd
        run: |
          cmake --preset win-x64-release -B cmake-build-win-x64-release -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
          cmake --build cmake-build-win-x64-release -j

      - uses: actions/upload-artifact@v7
        with:
          name: demo-windows-x64
          path: |
            cmake-build-win-x64-release/demo.exe
            cmake-build-win-x64-release/tracks
            cmake-build-win-x64-release/sfx
          if-no-files-found: error

