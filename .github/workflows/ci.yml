        run: |
          cmake --preset win-x86-release -B cmake-build-win-x86-release -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
          cmake --build cmake-build-win-x86-release -j

      - uses: actions/upload-artifact@v7
