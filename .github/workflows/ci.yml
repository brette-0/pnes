# Build matrix for pnes: NES ROM + GameCube/Wii .dol + 3DS .3dsx +
# PlayStation 2 .elf + desktop targets (Linux x64/x86/arm64, macOS arm64/x64,
# Windows x64/x86/arm64).
#
# Local reproduction:
#   The `nes`, `gc`, `wii`, `ctr`, `ps2`, `linux-x64` and `linux-x86` jobs are just
#   `docker compose run` against the images in docker/, so they reproduce
#   locally byte-for-byte:
#
#       docker compose run --rm build-nes      # == the `nes` job
#       PRESET=nes-pal-release docker compose run --rm build-nes  # == the `nes-pal` job
#       docker compose run --rm build-gc       # == the `gc` job
#       PRESET=gc-pal-release docker compose run --rm build-gc  # == the `gc-pal` job
#       docker compose run --rm build-wii      # == the `wii` job
#       docker compose run --rm build-3ds      # == the `ctr` job
#       docker compose run --rm build-switch   # == the `switch` job
#       docker compose run --rm build-nds      # == the `nds` job
#       docker compose run --rm build-dsi      # == the `dsi` job
#       docker compose run --rm build-ps2      # == the `ps2` job
#       docker compose run --rm build-linux    # == the `linux-x64` job's compile
#       PRESET=linux-x86-release docker compose run --rm build-linux  # == the `linux-x86` job's compile
#       PRESET=linux-arm64-release docker compose run --rm build-linux  # == the `linux-arm64` job's compile
#
#   To run the workflow itself locally, use act (https://github.com/nektos/act),
#   which executes Linux-container jobs against the host Docker daemon:
#
#       act -j nes
#       act -j nes-pal
#       act -j gc
#       act -j gc-pal
#       act -j wii
#       act -j ctr
#       act -j switch
#       act -j nds
#       act -j dsi
#       act -j ps2
#       act -j linux-x64
#       act -j linux-x86
#
#   act cannot emulate GitHub's macOS/Windows runners, so the `mac-arm64`,
#   `mac-x64`, `win-x64`, `win-x86` and `win-arm64` jobs are GitHub-hosted
#   only -- there is no local equivalent on a Linux box.
#
#   blobman-check (below) gates nothing and publishes nothing: it rebuilds the
#   CHR blob from demo/chr/config.toml with tools/blobman and diffs the result
#   against the committed demo/chr/chr.bin and chr.h. A local build repacks
#   that pair itself (the root CMakeLists.txt runs blobman at configure time),
#   but committing the result is still manual, so this is what catches the
#   committed pair drifting away from the manifest or the art under
#   demo/chr/assets/. Locally:
#
#       act -j blobman-check
#       cd demo/chr && blobman -i config.toml -o chr.bin -l cpp -v
#
#   animator-check (below) is the same arrangement for the animation data:
#   demo/animations/gen/*.hpp (the pattern-byte tables demo/src reads a frame
#   of animation out of) are committed, and this re-exports them from
#   demo/animations/animations.anim with tools/animator's headless exporter and
#   diffs the result. Every platform job re-exports them for itself as part of
#   its own configure (the animator-export step in the root CMakeLists.txt),
#   falling back to the committed headers on an image that cannot build the
#   exporter -- so, as with blobman, what needs catching is the committed
#   headers drifting away from the project or from the CHR layout they resolve
#   against. Locally:
#
#       act -j animator-check
#       cmake --build <builddir>   # the headers re-export as part of configure
#       tools/animator/build/ci/animator-export -i demo/animations/<project>.anim \
#           -o demo/animations/gen -v
#
#   Every platform job needs codegen-check (below), which builds tools/uitk
#   (needs Qt) and exports demo/gen/<name>/<target>/<name>.hpp|.cpp for every
#   demo/ui/<name>.uis -- demo/gen/ is gitignored, so every other job downloads codegen-check's
#   demo-gen artifact instead of regenerating it (or having a committed copy
#   to fall back to). Reproduce it locally with:
#
#       cmake --build <builddir>   # demo/gen/ regenerates as part of configure
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Newer pushes to the same ref cancel in-flight runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Gates every platform build below: builds tools/uitk (needs Qt) and
  # exports demo/gen/<name>/<target>/<name>.hpp|.cpp for every demo/ui/<name>.uis,
  # then publishes the result as the demo-gen artifact every other job downloads. demo/gen/
  # is gitignored -- there's nothing committed to fall back to and nothing to
  # diff against -- so this is the only job that ever builds/runs uitk
  # itself (most of the other jobs' Docker images/runners don't have Qt at
  # all), and a failed export here (a malformed .uis, say) fails fast before
  # wasting time on 19 platform builds that would all fail the same way once
  # they found no demo-gen artifact to download. Reproduce locally with a Qt
  # install: `cmake --build <builddir>` regenerates demo/gen/ as part of its
  # own configure step (see CMakeLists.txt).
  codegen-check:
    name: Codegen check (uitk export)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev

      - name: Build uitk
        run: |
          cmake -S tools/uitk -B tools/uitk/build/ci
          cmake --build tools/uitk/build/ci -j"$(nproc)"

      - name: Export demo/gen/<name>/*/<name>.hpp|.cpp for every demo/ui/*.uis
        run: |
          for scene in demo/ui/*.uis; do
            name=$(basename "$scene" .uis)
            tools/uitk/build/ci/uitk --export-all \
              --input "$scene" \
              --output "demo/gen/$name"
          done

      - uses: actions/upload-artifact@v7
        with:
          name: demo-gen
          path: demo/gen
          if-no-files-found: error

  # demo/chr/chr.bin (the cartridge's whole CHR ROM image) and demo/chr/chr.h
  # (the blob::<entry>::<tile> ids six demo TUs include) are both COMMITTED and
  # repacked by hand, so nothing in any platform build below regenerates them.
  # That is exactly why this job exists: a stale pair compiles perfectly well
  # against tile ids that no longer describe the blob, and every platform job
  # would go green over it.
  #
  # Gates nothing and publishes nothing -- it is a diff, not a producer, so it
  # does not block the 19 platform builds the way codegen-check has to.
  #
  # Runs on the bare runner rather than a container: blobman is host-native
  # C++20 whose only dependency is toml++, which its own CMakeLists fetches
  # when the host has no system package (the runners do not).
  blobman-check:
    name: Blobman check (CHR pack)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build blobman
        run: |
          cmake -S tools/blobman -B tools/blobman/build/ci -DCMAKE_BUILD_TYPE=Release
          cmake --build tools/blobman/build/ci -j"$(nproc)"

      # -v for the per-entry fill report ("entry: ui filled 832 of 1024
      # bytes") -- the only visibility into a hunk quietly running out of room,
      # and the build log is where that belongs.
      #
      # Relative paths with demo/chr as the working directory, for two reasons:
      # the manifest's includes resolve against it, and blobman echoes the -i
      # path into chr.h's own provenance comment, so an absolute path would
      # never match the committed header.
      - name: Repack demo/chr/chr.bin + chr.h
        working-directory: demo/chr
        run: ../../tools/blobman/build/ci/blobman -i config.toml -o chr.bin -l cpp -v

      - name: Check the committed blob and header are in sync
        run: |
          if ! git diff --exit-code -- demo/chr/chr.bin demo/chr/chr.h; then
            echo "::error::demo/chr/chr.bin or chr.h is out of date." \
                 "Repack and commit: cd demo/chr && blobman -i config.toml -o chr.bin -l cpp -v"
            exit 1
          fi

  # demo/animations/gen/*.hpp -- the pattern-byte tables demo/src reads its
  # animation frames out of -- are COMMITTED, exactly like blobman's pair, and
  # exported by hand from the designer. Every platform build re-exports them
  # at configure time (the animator-export step in the root CMakeLists.txt),
  # but only where the image can build the exporter at all, and committing the
  # result is manual either way. That is why this job exists: a stale header
  # compiles perfectly well against pattern bytes that no longer describe the
  # CHR layout, and the sprite draws as something else entirely on the console
  # with every platform job green over it.
  #
  # Gates nothing and publishes nothing -- a diff, not a producer, so unlike
  # codegen-check it does not block the platform builds.
  #
  # Runs on the bare runner rather than a container, like blobman-check: the
  # exporter is host-native C++23 whose only dependency is toml++, which the
  # animator's own CMakeLists fetches when the host has no system package (the
  # runners do not). ANIMATOR_GUI=OFF keeps Qt out of it -- the export pipeline
  # is deliberately Qt-free, and the designer itself is not wanted here.
  animator-check:
    name: Animator check (animation export)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build animator-export
        run: |
          cmake -S tools/animator -B tools/animator/build/ci \
            -DCMAKE_BUILD_TYPE=Release -DANIMATOR_GUI=OFF
          cmake --build tools/animator/build/ci --target animator-export -j"$(nproc)"

      # -v here, unlike the configure-time export: this is the log someone
      # reads when the diff below fails, so it dumps every frame's pattern
      # bytes and the sheet's own cell warnings alongside the per-header
      # summary.
      - name: Re-export demo/animations/gen/*.hpp
        run: |
          for project in demo/animations/*.anim; do
            tools/animator/build/ci/animator-export \
              -i "$project" -o demo/animations/gen -v
          done

      - name: Check the committed animation headers are in sync
        run: |
          if ! git diff --exit-code -- demo/animations/gen; then
            echo "::error::demo/animations/gen is out of date." \
                 "Re-export and commit: animator-export -i demo/animations/animations.anim" \
                 "-o demo/animations/gen -v (or File > Export All Headers in the designer)"
            exit 1
          fi

  nes:
    name: NES (ROM)
    needs: codegen-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # demo/gen/ (uitk's output) is gitignored -- codegen-check is the only
      # job that builds/runs uitk itself (it needs Qt); every other job just
      # downloads what it produced instead of installing Qt itself.
      - name: Download generated UI code
        uses: actions/download-artifact@v7
        with:
          name: demo-gen
          path: demo/gen

      # FetchContent (intsh/tuple) + the FamiStudio download land in the build
      # tree; caching it across runs skips re-cloning and re-measuring.
      - name: Cache build tree
        uses: actions/cache@v5
        with:
          path: cmake-build-ci-nes-release
          key: nes-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', 'docker/Dockerfile.nes') }}
          restore-keys: nes-

      - name: Build demo.nes
        run: docker compose run --rm --build build-nes

      - uses: actions/upload-artifact@v7
        with:
          name: demo-nes
          path: cmake-build-ci-nes-release/demo.nes
          if-no-files-found: error

  nes-pal:
    name: NES PAL (ROM)
    needs: codegen-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # demo/gen/ (uitk's output) is gitignored -- codegen-check is the only
      # job that builds/runs uitk itself (it needs Qt); every other job just
      # downloads what it produced instead of installing Qt itself.
      - name: Download generated UI code
        uses: actions/download-artifact@v7
        with:
          name: demo-gen
          path: demo/gen

      - name: Cache build tree
        uses: actions/cache@v5
        with:
          path: cmake-build-ci-nes-pal-release
          key: nes-pal-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', 'docker/Dockerfile.nes') }}
          restore-keys: nes-pal-

      # Same image/service as the `nes` job, just pointed at the nes-pal-release
      # preset (TARGET_PLATFORM=nes_pal -> REGION=1, PAL FamiStudio note tables).
      - name: Build demo.nes (PAL)
        run: docker compose run --rm --build -e PRESET=nes-pal-release build-nes

      - uses: actions/upload-artifact@v7
        with:
          name: demo-nes-pal
          path: cmake-build-ci-nes-pal-release/demo.nes
          if-no-files-found: error

  gc:
    name: GameCube (.dol)
    needs: codegen-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # demo/gen/ (uitk's output) is gitignored -- codegen-check is the only
      # job that builds/runs uitk itself (it needs Qt); every other job just
      # downloads what it produced instead of installing Qt itself.
      - name: Download generated UI code
        uses: actions/download-artifact@v7
        with:
          name: demo-gen
          path: demo/gen

      - name: Cache build tree
        uses: actions/cache@v5
        with:
          path: cmake-build-ci-gc-release
          key: gc-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', 'docker/Dockerfile.ogc') }}
          restore-keys: gc-

      - name: Build demo.dol
        run: docker compose run --rm --build build-gc

      - uses: actions/upload-artifact@v7
        with:
          name: demo-gamecube
          path: cmake-build-ci-gc-release/demo.dol
          if-no-files-found: error

  gc-pal:
    name: GameCube PAL (.dol)
    needs: codegen-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # demo/gen/ (uitk's output) is gitignored -- codegen-check is the only
      # job that builds/runs uitk itself (it needs Qt); every other job just
      # downloads what it produced instead of installing Qt itself.
      - name: Download generated UI code
        uses: actions/download-artifact@v7
        with:
          name: demo-gen
          path: demo/gen

      - name: Cache build tree
        uses: actions/cache@v5
        with:
          path: cmake-build-ci-gc-pal-release
          key: gc-pal-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', 'docker/Dockerfile.ogc') }}
          restore-keys: gc-pal-

      # Same image/service as the `gc` job, just pointed at the gc-pal-release
      # preset (TARGET_PLATFORM=gc_pal -> REGION=1, native 50Hz PAL video mode).
      - name: Build demo.dol (PAL)
        run: docker compose run --rm --build -e PRESET=gc-pal-release build-gc

      - uses: actions/upload-artifact@v7
        with:
          name: demo-gamecube-pal
          path: cmake-build-ci-gc-pal-release/demo.dol
          if-no-files-found: error

  wii:
    name: Wii (.dol)
    needs: codegen-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # demo/gen/ (uitk's output) is gitignored -- codegen-check is the only
      # job that builds/runs uitk itself (it needs Qt); every other job just
      # downloads what it produced instead of installing Qt itself.
      - name: Download generated UI code
        uses: actions/download-artifact@v7
        with:
