          path: demo/gen

      - name: Cache build tree
        uses: actions/cache@v5
        with:
          path: cmake-build-ci-wii-release
          key: wii-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', 'docker/Dockerfile.ogc') }}
          restore-keys: wii-

      - name: Build demo.dol
        run: docker compose run --rm --build build-wii

      - uses: actions/upload-artifact@v7
        with:
          name: demo-wii
          path: cmake-build-ci-wii-release/demo.dol
          if-no-files-found: error

  ctr:
    name: 3DS (.3dsx)
    needs: codegen-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # demo/gen/ (uitk's output) is gitignored -- codegen-check is the only
      # job that builds/runs uitk itself (it needs Qt); every other job just
      # downloads what it produced instead of installing Qt itself.
      - name: Download generated UI code
        uses: actions/download-artifact@v7
        with:
