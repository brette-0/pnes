    needs: codegen-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # demo/gen/ (uitk's output) is gitignored -- codegen-check is the only
      # job that builds/runs uitk itself (it needs Qt); every other job just
      # downloads what it produced instead of installing Qt itself.
      - name: Download generated UI code
        uses: actions/download-artifact@v7
        with:
          name: demo-gen
          path: demo/gen

      - name: Cache build tree
        uses: actions/cache@v5
        with:
          path: cmake-build-ci-switch-release
          key: switch-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', 'docker/Dockerfile.switch') }}
          restore-keys: switch-

      - name: Build demo.nro
        run: docker compose run --rm --build build-switch

      - uses: actions/upload-artifact@v7
        with:
          name: demo-switch
