          key: dsi-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', 'docker/Dockerfile.nds') }}
          restore-keys: dsi-

      - name: Build demo.nds (DSi)
        run: docker compose run --rm --build build-dsi

      - uses: actions/upload-artifact@v7
        with:
          name: demo-dsi
          path: cmake-build-ci-dsi-release/demo.nds
          if-no-files-found: error

  wiiu:
    name: Wii U (.rpx)
    needs: codegen-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # demo/gen/ (uitk's output) is gitignored -- codegen-check is the only
      # job that builds/runs uitk itself (it needs Qt); every other job just
      # downloads what it produced instead of installing Qt itself.
      - name: Download generated UI code
        uses: actions/download-artifact@v7
        with:
          name: demo-gen
          path: demo/gen

      - name: Cache build tree
        uses: actions/cache@v5
        with:
          path: cmake-build-ci-wiiu-release
          key: wiiu-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', 'docker/Dockerfile.wiiu') }}
          restore-keys: wiiu-

      # Builds the homebrew .rpx/.wuhb AND assembles the installable-title
      # (demo-wup): the unpacked code/content/meta tree, plus a packed WUP when
      # the optional WIIU_COMMON_KEY secret is present. The key is copyrighted, so
      # forks/PRs without the secret simply get the tree (NUSPacker is skipped) --
      # the build never fails for lack of a key.
      - name: Build demo.rpx + WUP
        env:
          WIIU_COMMON_KEY: ${{ secrets.WII_U_COMMON_KEY }}
        run: docker compose run --rm --build -e WIIU_COMMON_KEY build-wiiu

      - uses: actions/upload-artifact@v7
        with:
          name: demo-wiiu
          path: |
            cmake-build-ci-wiiu-release/demo.rpx
            cmake-build-ci-wiiu-release/demo.wuhb
          if-no-files-found: error

      # The installable-title outputs: the unpacked tree (always) and the packed
      # WUP (only when the common-key secret was set). Don't fail if the WUP is
      # absent -- the tree alone is a valid artifact users can pack themselves.
      - uses: actions/upload-artifact@v7
        with:
          name: demo-wiiu-wup
          path: |
            cmake-build-ci-wiiu-release/wup
            cmake-build-ci-wiiu-release/wup-installable
          if-no-files-found: warn

  # PlayStation 2 (ps2sdk / EE+IOP). Unlike the devkitPro jobs above, the
  # toolchain comes from the official prebuilt ps2dev/ps2dev image (Alpine) and
  # the CMake toolchain file is this project's own cmake/PS2.cmake -- ps2dev
  # ships none. The build also transcodes demo/audio/tracks/pc_audio.wav into
  # the music asset the ELF #embeds, using ffmpeg plus ps2sdk's own adpenc
  # (both present in the image), so the produced demo.elf is several MB larger
  # than the other console artifacts here -- that's the asset, not debug info.
  # PS2_MUSIC is left at its default (stream, the EE-decoded ADPCM backend);
  # the spu2 and vorbis backends are reference paths and aren't gated here.
  ps2:
    name: PlayStation 2 (.elf)
    needs: codegen-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # demo/gen/ (uitk's output) is gitignored -- codegen-check is the only
      # job that builds/runs uitk itself (it needs Qt); every other job just
      # downloads what it produced instead of installing Qt itself.
      - name: Download generated UI code
        uses: actions/download-artifact@v7
        with:
          name: demo-gen
          path: demo/gen

      - name: Cache build tree
        uses: actions/cache@v5
        with:
          path: cmake-build-ci-ps2-release
          key: ps2-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', 'cmake/PS2.cmake', 'docker/Dockerfile.ps2') }}
          restore-keys: ps2-

      - name: Build demo.elf
        run: docker compose run --rm --build build-ps2

      - uses: actions/upload-artifact@v7
        with:
          name: demo-ps2
          path: cmake-build-ci-ps2-release/demo.elf
          if-no-files-found: error

  linux-x64:
    name: Linux (x64) (AppImage)
    needs: codegen-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # demo/gen/ (uitk's output) is gitignored -- codegen-check is the only
      # job that builds/runs uitk itself (it needs Qt); every other job just
      # downloads what it produced instead of installing Qt itself.
      - name: Download generated UI code
        uses: actions/download-artifact@v7
        with:
          name: demo-gen
          path: demo/gen

      - name: Cache build tree
        uses: actions/cache@v5
        with:
          path: cmake-build-ci-linux-release
          key: linux-x64-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', 'docker/Dockerfile.linux') }}
          restore-keys: linux-x64-

      # Override the service command to drive the demo-appimage target (which
      # depends on demo), inside the same image the local `build-linux` uses.
      - name: Build AppImage
        run: |
          docker compose run --rm --build build-linux bash -c '
            set -euo pipefail
            cmake --preset linux-release -B cmake-build-ci-linux-release
            cmake --build cmake-build-ci-linux-release --target demo-appimage -j"$(nproc)"
          '

