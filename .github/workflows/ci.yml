# Build matrix for platform-nes: NES ROM + GameCube/Wii .dol + 3DS .3dsx +
# desktop targets (Linux x64/x86, macOS, Windows x64/x86).
#
# Local reproduction:
#   The `nes`, `gc`, `wii`, `ctr`, `linux-x64` and `linux-x86` jobs are just
#   `docker compose run` against the images in docker/, so they reproduce
#   locally byte-for-byte:
#
#       docker compose run --rm build-nes      # == the `nes` job
#       PRESET=nes-pal-release docker compose run --rm build-nes  # == the `nes-pal` job
#       docker compose run --rm build-gc       # == the `gc` job
#       docker compose run --rm build-wii      # == the `wii` job
#       docker compose run --rm build-3ds      # == the `ctr` job
#       docker compose run --rm build-switch   # == the `switch` job
#       docker compose run --rm build-nds      # == the `nds` job
#       docker compose run --rm build-dsi      # == the `dsi` job
#       docker compose run --rm build-linux    # == the `linux-x64` job's compile
#       PRESET=linux-x86-release docker compose run --rm build-linux  # == the `linux-x86` job's compile
#
#   To run the workflow itself locally, use act (https://github.com/nektos/act),
#   which executes Linux-container jobs against the host Docker daemon:
#
#       act -j nes
#       act -j nes-pal
#       act -j gc
#       act -j wii
#       act -j ctr
#       act -j switch
#       act -j nds
#       act -j dsi
#       act -j linux-x64
#       act -j linux-x86
#
#   act cannot emulate GitHub's macOS/Windows runners, so the `mac`, `win-x64`
#   and `win-x86` jobs are GitHub-hosted only -- there is no local equivalent
#   on a Linux box.
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Newer pushes to the same ref cancel in-flight runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nes:
    name: NES (ROM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # FetchContent (intsh/tuple) + the FamiStudio download land in the build
      # tree; caching it across runs skips re-cloning and re-measuring.
      - name: Cache build tree
        uses: actions/cache@v5
        with:
          path: cmake-build-ci-nes-release
          key: nes-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', 'docker/Dockerfile.nes') }}
          restore-keys: nes-

      - name: Build demo.nes
        run: docker compose run --rm --build build-nes

      - uses: actions/upload-artifact@v7
        with:
          name: demo-nes
          path: cmake-build-ci-nes-release/demo.nes
          if-no-files-found: error

  nes-pal:
    name: NES PAL (ROM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Cache build tree
        uses: actions/cache@v5
        with:
          path: cmake-build-ci-nes-pal-release
          key: nes-pal-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', 'docker/Dockerfile.nes') }}
          restore-keys: nes-pal-

      # Same image/service as the `nes` job, just pointed at the nes-pal-release
      # preset (TARGET_PLATFORM=nes_pal -> REGION=1, PAL FamiStudio note tables).
      - name: Build demo.nes (PAL)
        run: docker compose run --rm --build -e PRESET=nes-pal-release build-nes

      - uses: actions/upload-artifact@v7
        with:
          name: demo-nes-pal
          path: cmake-build-ci-nes-pal-release/demo.nes
          if-no-files-found: error

  gc:
    name: GameCube (.dol)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Cache build tree
        uses: actions/cache@v5
        with:
          path: cmake-build-ci-gc-release
          key: gc-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', 'docker/Dockerfile.ogc') }}
          restore-keys: gc-

      - name: Build demo.dol
        run: docker compose run --rm --build build-gc

      - uses: actions/upload-artifact@v7
        with:
          name: demo-gamecube
          path: cmake-build-ci-gc-release/demo.dol
          if-no-files-found: error

  wii:
    name: Wii (.dol)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Cache build tree
        uses: actions/cache@v5
        with:
          path: cmake-build-ci-wii-release
          key: wii-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', 'docker/Dockerfile.ogc') }}
          restore-keys: wii-

      - name: Build demo.dol
        run: docker compose run --rm --build build-wii

      - uses: actions/upload-artifact@v7
        with:
          name: demo-wii
          path: cmake-build-ci-wii-release/demo.dol
          if-no-files-found: error

  ctr:
    name: 3DS (.3dsx)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Cache build tree
        uses: actions/cache@v5
        with:
          path: cmake-build-ci-ctr-release
          key: ctr-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', 'docker/Dockerfile.3ds') }}
          restore-keys: ctr-

      - name: Build demo.3dsx
        run: docker compose run --rm --build build-3ds

      - uses: actions/upload-artifact@v7
        with:
          name: demo-3ds
          path: cmake-build-ci-ctr-release/demo.3dsx
          if-no-files-found: error

  switch:
    name: Switch (.nro)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Cache build tree
        uses: actions/cache@v5
        with:
          path: cmake-build-ci-switch-release
          key: switch-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', 'docker/Dockerfile.switch') }}
          restore-keys: switch-

      - name: Build demo.nro
        run: docker compose run --rm --build build-switch

      - uses: actions/upload-artifact@v7
        with:
          name: demo-switch
          path: cmake-build-ci-switch-release/demo.nro
          if-no-files-found: error

  nds:
    name: Nintendo DS (.nds)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Cache build tree
        uses: actions/cache@v5
        with:
          path: cmake-build-ci-nds-release
          key: nds-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', 'docker/Dockerfile.nds') }}
          restore-keys: nds-

      - name: Build demo.nds
        run: docker compose run --rm --build build-nds

      - uses: actions/upload-artifact@v7
        with:
          name: demo-nds
          path: cmake-build-ci-nds-release/demo.nds
          if-no-files-found: error

  dsi:
    name: Nintendo DSi (.nds)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Cache build tree
        uses: actions/cache@v5
        with:
          path: cmake-build-ci-dsi-release
          key: dsi-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', 'docker/Dockerfile.nds') }}
          restore-keys: dsi-

      - name: Build demo.nds (DSi)
        run: docker compose run --rm --build build-dsi

      - uses: actions/upload-artifact@v7
        with:
          name: demo-dsi
          path: cmake-build-ci-dsi-release/demo.nds
          if-no-files-found: error

  wiiu:
    name: Wii U (.rpx)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Cache build tree
        uses: actions/cache@v5
        with:
          path: cmake-build-ci-wiiu-release
          key: wiiu-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', 'docker/Dockerfile.wiiu') }}
          restore-keys: wiiu-

      # Builds the homebrew .rpx/.wuhb AND assembles the installable-title
      # (demo-wup): the unpacked code/content/meta tree, plus a packed WUP when
      # the optional WIIU_COMMON_KEY secret is present. The key is copyrighted, so
      # forks/PRs without the secret simply get the tree (NUSPacker is skipped) --
      # the build never fails for lack of a key.
      - name: Build demo.rpx + WUP
        env:
          WIIU_COMMON_KEY: ${{ secrets.WII_U_COMMON_KEY }}
        run: docker compose run --rm --build -e WIIU_COMMON_KEY build-wiiu

      - uses: actions/upload-artifact@v7
        with:
          name: demo-wiiu
          path: |
            cmake-build-ci-wiiu-release/demo.rpx
            cmake-build-ci-wiiu-release/demo.wuhb
          if-no-files-found: error

      # The installable-title outputs: the unpacked tree (always) and the packed
      # WUP (only when the common-key secret was set). Don't fail if the WUP is
      # absent -- the tree alone is a valid artifact users can pack themselves.
      - uses: actions/upload-artifact@v7
        with:
          name: demo-wiiu-wup
          path: |
            cmake-build-ci-wiiu-release/wup
            cmake-build-ci-wiiu-release/wup-installable
          if-no-files-found: warn

  linux-x64:
    name: Linux (x64) (AppImage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Cache build tree
        uses: actions/cache@v5
        with:
          path: cmake-build-ci-linux-release
          key: linux-x64-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', 'docker/Dockerfile.linux') }}
          restore-keys: linux-x64-

      # Override the service command to drive the demo-appimage target (which
      # depends on demo), inside the same image the local `build-linux` uses.
      - name: Build AppImage
        run: |
          docker compose run --rm --build build-linux bash -c '
            set -euo pipefail
            cmake --preset linux-release -B cmake-build-ci-linux-release
            cmake --build cmake-build-ci-linux-release --target demo-appimage -j"$(nproc)"
          '

      - uses: actions/upload-artifact@v7
        with:
          name: demo-linux-x64-appimage
          path: cmake-build-ci-linux-release/*.AppImage
          if-no-files-found: error

  linux-x86:
    name: Linux (x86) (AppImage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Cache build tree
        uses: actions/cache@v5
        with:
          path: cmake-build-ci-linux-x86-release
          key: linux-x86-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', 'docker/Dockerfile.linux') }}
          restore-keys: linux-x86-

      # Same image as linux-x64 -- docker/Dockerfile.linux also installs the
      # i386 multiarch SDL3/libusb/ALSA -dev packages and g++-multilib, so the
      # linux-x86-release preset (i686-linux-gnu compiler target) builds and
      # packages a real 32-bit AppImage here. CMakeLists.txt auto-detects the
      # right PKG_CONFIG_LIBDIR for whichever 32-bit pkgconfig layout is
      # present (this image's Debian i386 multiarch dir, or Arch/openSUSE's
      # /usr/lib32 for local native builds) -- no hardcoded env var needed.
      - name: Build AppImage
        run: |
          docker compose run --rm --build build-linux bash -c '
            set -euo pipefail
            cmake --preset linux-x86-release -B cmake-build-ci-linux-x86-release
            cmake --build cmake-build-ci-linux-x86-release --target demo-appimage -j"$(nproc)"
          '

      - uses: actions/upload-artifact@v7
        with:
          name: demo-linux-x86-appimage
          path: cmake-build-ci-linux-x86-release/*.AppImage
          if-no-files-found: error

  mac:
    name: macOS (app)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install build tools
        run: brew install ninja

      - name: Cache build tree
        uses: actions/cache@v5
        with:
          path: cmake-build-mac-release
          key: mac-v2-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json') }}
          restore-keys: mac-v2-

      - name: Build demo
        run: |
          cmake --preset mac-release -B cmake-build-mac-release
          cmake --build cmake-build-mac-release -j"$(sysctl -n hw.ncpu)"

      - uses: actions/upload-artifact@v7
        with:
          name: demo-macos
          path: |
            cmake-build-mac-release/demo
            cmake-build-mac-release/tracks
            cmake-build-mac-release/sfx
          if-no-files-found: error

  win-x64:
    name: Windows (x64) (exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      # Set up the MSVC developer environment: provides the Windows SDK headers/
      # libs and puts Visual Studio's bundled Ninja on PATH. clang (preinstalled
      # on the runner) then targets the MSVC ABI while still accepting the GNU
      # compound-literal / gnu++23 extensions the engine relies on -- which cl
      # would reject.
      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Cache build tree
        uses: actions/cache@v5
        with:
          path: cmake-build-win-x64-release
          key: win-x64-v2-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json') }}
          restore-keys: win-x64-v2-

      - name: Build demo
        shell: cmd
        run: |
          cmake --preset win-x64-release -B cmake-build-win-x64-release -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
          cmake --build cmake-build-win-x64-release -j

      - uses: actions/upload-artifact@v7
        with:
          name: demo-windows-x64
          path: |
            cmake-build-win-x64-release/demo.exe
            cmake-build-win-x64-release/tracks
            cmake-build-win-x64-release/sfx
          if-no-files-found: error

  win-x86:
    name: Windows (x86) (exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      # Same MSVC-environment/clang setup as win-x64, but arch: x86 puts the
      # 32-bit link.exe and Windows SDK import libs on PATH instead. Clang
      # itself still needs CMAKE_C(XX)_COMPILER_TARGET (set by the
      # win-x86-release preset) to stop targeting the runner's native
      # x86_64 -- vcvarsall alone doesn't change clang's default target.
      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Cache build tree
        uses: actions/cache@v5
        with:
          path: cmake-build-win-x86-release
          key: win-x86-v2-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json') }}
          restore-keys: win-x86-v2-

      - name: Build demo
        shell: cmd
        run: |
          cmake --preset win-x86-release -B cmake-build-win-x86-release -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
          cmake --build cmake-build-win-x86-release -j

      - uses: actions/upload-artifact@v7
        with:
          name: demo-windows-x86
          path: |
            cmake-build-win-x86-release/demo.exe
            cmake-build-win-x86-release/tracks
            cmake-build-win-x86-release/sfx
          if-no-files-found: error
